<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Mini App — Device Info</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #17212b;
      color: #e9e9e9;
      padding: 16px;
      min-height: 100vh;
    }
    h1 { font-size: 18px; margin-bottom: 4px; color: #6ab2f2; }
    p.sub { font-size: 12px; color: #7d8b99; margin-bottom: 16px; }
    .card {
      background: #1e2a36;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #2b3a48;
    }
    .card h2 {
      font-size: 13px;
      color: #6ab2f2;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    pre {
      background: #0e1621;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 11px;
      line-height: 1.5;
      color: #a8d8a8;
      white-space: pre-wrap;
      word-break: break-all;
    }
    button {
      background: #5288c1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      margin-top: 12px;
      cursor: pointer;
    }
    button:active { background: #3f6fa3; }

    /* Verification banner */
    #verify-banner {
      margin-top: 16px;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      border: 2px solid transparent;
    }
    #verify-banner.new {
      display: block;
      background: #1e3a2b;
      border-color: #2ecc71;
      color: #a8e6b8;
    }
    #verify-banner.returning {
      display: block;
      background: #1e2f3a;
      border-color: #5299d3;
      color: #a8d0f0;
    }
    #verify-banner.multi {
      display: block;
      background: #3a1e1e;
      border-color: #e74c3c;
      color: #f0a8a8;
    }
    #verify-banner .icon { font-size: 22px; margin-right: 8px; }
    #verify-banner .title { font-weight: 700; font-size: 16px; display: block; margin-bottom: 6px; }
    #verify-banner .detail { font-size: 13px; opacity: 0.9; }
    #verify-banner .acct {
      display: inline-block;
      background: rgba(0,0,0,0.35);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      margin: 2px 4px 2px 0;
    }

    /* Block overlay */
    #block-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    #block-overlay.show { display: flex; }
    #block-overlay .box {
      background: #2a1515;
      border: 2px solid #e74c3c;
      border-radius: 16px;
      padding: 28px;
      max-width: 400px;
      text-align: center;
    }
    #block-overlay h2 { color: #ff6b6b; font-size: 20px; margin-bottom: 12px; }
    #block-overlay p { font-size: 14px; color: #f0c0c0; margin-bottom: 8px; line-height: 1.5; }
    #block-overlay .acct-badge {
      display: inline-block;
      background: #3a1e1e;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: monospace;
      margin: 6px 4px;
      color: #ffb0b0;
    }
  </style>
</head>
<body>

  <h1>Device & Telegram Info</h1>
  <p class="sub">Collected inside Telegram Mini App</p>

  <div class="card">
    <h2>Telegram initData</h2>
    <pre id="tg-output">Loading...</pre>
  </div>

  <div class="card">
    <h2>Device Fingerprint</h2>
    <pre id="device-output">Loading...</pre>
  </div>

  <div class="card">
    <h2>Combined JSON</h2>
    <pre id="combined-output">Loading...</pre>
  </div>

  <button id="copy-btn">Copy Combined JSON</button>

  <!-- Verification banner -->
  <div id="verify-banner"></div>

  <!-- Block overlay (shown when multi-account detected and blocking enabled) -->
  <div id="block-overlay">
    <div class="box">
      <h2>🚨 Access Denied</h2>
      <p>Multiple accounts detected on this device.</p>
      <p>This device is already linked to:</p>
      <div id="blocked-account-info"></div>
      <p style="margin-top:16px;font-size:12px;opacity:0.7;">
        Your current account has been flagged.
      </p>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const CONFIG = {
      STORAGE_KEY: "device_account_registry",
      BLOCK_MULTI_ACCOUNTS: false,   // set to true to disable the page on multi-acc
      SHOW_USER_ID: true,            // show user ID in messages
      SHOW_FIRST_NAME: true          // show first name in messages
    };

    // ============================================================
    // UTILITIES
    // ============================================================
    async function sha256(str) {
      const buf = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest("SHA-256", buf);
      return [...new Uint8Array(hash)]
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    // ============================================================
    // FINGERPRINT COLLECTORS
    // ============================================================
    function getCanvasHash() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 200;
        canvas.height = 50;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillStyle = "#f60";
        ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = "#069";
        ctx.fillText("Telegram MiniApp 🚀", 2, 15);
        ctx.fillStyle = "rgba(102,204,0,0.7)";
        ctx.fillText("Telegram MiniApp 🚀", 4, 17);
        return canvas.toDataURL();
      } catch (e) {
        return "canvas-error";
      }
    }

    function getWebGLInfo() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { vendor: null, renderer: null };
        const dbg = gl.getExtension("WEBGL_debug_renderer_info");
        return {
          vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
          renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
        };
      } catch (e) {
        return { vendor: null, renderer: null };
      }
    }

    async function getAudioHash() {
      try {
        const AudioCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!AudioCtx) return null;
        const ctx = new AudioCtx(1, 44100, 44100);
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.value = 10000;
        const comp = ctx.createDynamicsCompressor();
        osc.connect(comp);
        comp.connect(ctx.destination);
        osc.start(0);
        const buffer = await ctx.startRendering();
        const data = buffer.getChannelData(0).slice(4500, 5000);
        return await sha256(data.join(","));
      } catch (e) {
        return null;
      }
    }

    function detectFonts(fontList) {
      const baseFonts = ["monospace", "sans-serif", "serif"];
      const testString = "mmmmmmmmmmlli";
      const testSize = "72px";
      const span = document.createElement("span");
      span.style.position = "absolute";
      span.style.left = "-9999px";
      span.style.fontSize = testSize;
      span.textContent = testString;
      document.body.appendChild(span);

      const baseSizes = {};
      baseFonts.forEach(base => {
        span.style.fontFamily = base;
        baseSizes[base] = span.offsetWidth + "," + span.offsetHeight;
      });

      const detected = [];
      fontList.forEach(font => {
        let found = false;
        baseFonts.forEach(base => {
          span.style.fontFamily = `'${font}',${base}`;
          const size = span.offsetWidth + "," + span.offsetHeight;
          if (size !== baseSizes[base]) found = true;
        });
        if (found) detected.push(font);
      });

      document.body.removeChild(span);
      return detected;
    }

    // ============================================================
    // DEVICE INFO COLLECTION
    // ============================================================
    async function collectDeviceInfo() {
      const webgl = getWebGLInfo();
      const canvasData = getCanvasHash();
      const audioHash = await getAudioHash();

      const info = {
        hardware: {
          hardwareConcurrency: navigator.hardwareConcurrency || null,
          deviceMemory: navigator.deviceMemory || null,
          platform: navigator.platform || null,
          maxTouchPoints: navigator.maxTouchPoints || 0
        },
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          colorDepth: screen.colorDepth,
          pixelDepth: screen.pixelDepth,
          devicePixelRatio: window.devicePixelRatio || 1,
          orientation: screen.orientation ? screen.orientation.type : null
        },
        environment: {
          userAgent: navigator.userAgent,
          language: navigator.language,
          languages: navigator.languages || [],
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          timezoneOffset: new Date().getTimezoneOffset(),
          cookieEnabled: navigator.cookieEnabled,
          doNotTrack: navigator.doNotTrack
        },
        rendering: {
          canvas_hash: await sha256(canvasData),
          webgl_vendor: webgl.vendor,
          webgl_renderer: webgl.renderer,
          audio_hash: audioHash,
          fonts_detected: detectFonts([
            "Arial", "Helvetica", "Times New Roman", "Courier New",
            "Roboto", "Noto Sans", "Segoe UI", "Verdana", "Tahoma",
            "Georgia", "Comic Sans MS", "Impact"
          ])
        },
        sensors: {
          accelerometer_available: "Accelerometer" in window,
          gyroscope_available: "Gyroscope" in window,
          magnetometer_available: "Magnetometer" in window
        }
      };

      const fpString = JSON.stringify({
        hw: info.hardware,
        screen: info.screen,
        env: info.environment,
        render: info.rendering
      });
      info.derived_fingerprint_hash = await sha256(fpString);

      return info;
    }

    // ============================================================
    // TELEGRAM DATA COLLECTION
    // ============================================================
    function collectTelegramData() {
      const tg = window.Telegram?.WebApp;
      if (!tg) return { error: "Not running inside Telegram" };

      const parsed = {};
      if (tg.initData) {
        const params = new URLSearchParams(tg.initData);
        for (const [key, value] of params.entries()) {
          if (key === "user") {
            try { parsed.user = JSON.parse(value); }
            catch { parsed.user = value; }
          } else {
            parsed[key] = value;
          }
        }
      }

      return {
        initData_raw: tg.initData || null,
        initDataUnsafe: tg.initDataUnsafe || null,
        parsed_initData: parsed,
        platform: tg.platform,
        version: tg.version,
        colorScheme: tg.colorScheme,
        themeParams: tg.themeParams,
        viewportHeight: tg.viewportHeight,
        viewportStableHeight: tg.viewportStableHeight,
        isExpanded: tg.isExpanded
      };
    }

    // ============================================================
    // ACCOUNT REGISTRY (localStorage)
    // ============================================================
    function loadRegistry() {
      try {
        return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveRegistry(reg) {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(reg));
    }

    /**
     * Check the fingerprint against the registry.
     * Returns:
     *   { status: "new",          ... }
     *   { status: "returning",    ... }
     *   { status: "multi",        ... }
     */
    function checkAccount(fingerprintHash, user) {
      const reg = loadRegistry();
      const now = new Date().toISOString();
      const entry = reg[fingerprintHash];

      // ---- Case 1: NEW DEVICE ----
      if (!entry) {
        reg[fingerprintHash] = {
          first_seen: now,
          last_seen: now,
          accounts: [
            {
              user_id: user.id,
              username: user.username || null,
              first_name: user.first_name || null,
              first_seen: now
            }
          ]
        };
        saveRegistry(reg);
        return { status: "new" };
      }

      // ---- Device exists — update last_seen ----
      entry.last_seen = now;

      // ---- Find if THIS account is already linked ----
      const existing = entry.accounts.find(a => a.user_id === user.id);

      // ---- Case 2: SAME ACCOUNT RETURNING ----
      if (existing) {
        existing.last_seen = now;
        saveRegistry(reg);
        return {
          status: "returning",
          account: existing
        };
      }

      // ---- Case 3: DIFFERENT ACCOUNT on same device ----
      const original = entry.accounts[0];   // first account ever seen

      // Add the new account to history (optional — remove if you want strict blocking)
      entry.accounts.push({
        user_id: user.id,
        username: user.username || null,
        first_name: user.first_name || null,
        first_seen: now
      });
      saveRegistry(reg);

      return {
        status: "multi",
        original,                 // first account on this device
        current: {
          user_id: user.id,
          username: user.username || null,
          first_name: user.first_name || null
        },
        allAccounts: entry.accounts
      };
    }

    // ============================================================
    // UI RENDERERS
    // ============================================================
    function renderBanner(result) {
      const el = document.getElementById("verify-banner");
      el.className = "";
      el.innerHTML = "";

      if (result.status === "new") {
        el.classList.add("new");
        el.innerHTML = `
          <span class="title"><span class="icon">🆕</span>New account detected</span>
          <span class="detail">This device has been registered. Welcome!</span>
        `;
      }

      else if (result.status === "returning") {
        const a = result.account;
        el.classList.add("returning");
        el.innerHTML = `
          <span class="title"><span class="icon">✅</span>Welcome back @${a.username || "user"}</span>
          <span class="detail">Same device, same account.</span>
        `;
      }

      else if (result.status === "multi") {
        const o = result.original;
        const c = result.current;
        el.classList.add("multi");

        let html = `
          <span class="title"><span class="icon">🚨</span>MULTIPLE ACCOUNTS DETECTED</span>
          <span class="detail">
            This device is already linked to:<br/>
            <span class="acct">👤 @${o.username || "unknown"}</span>
        `;
        if (CONFIG.SHOW_USER_ID) {
          html += `<span class="acct">🆔 ${o.user_id}</span>`;
        }
        if (CONFIG.SHOW_FIRST_NAME && o.first_name) {
          html += `<span class="acct">📛 ${o.first_name}</span>`;
        }
        html += `
            <br/><br/>
            Current account: <span class="acct">@${c.username || "unknown"}</span>
            ${CONFIG.SHOW_USER_ID ? `<span class="acct">🆔 ${c.user_id}</span>` : ""}
            <br/><br/>
            ⚠️ Access has been flagged.
          </span>
        `;
        el.innerHTML = html;

        if (CONFIG.BLOCK_MULTI_ACCOUNTS) {
          showBlockOverlay(o, c);
        }
      }
    }

    function showBlockOverlay(original, current) {
      const overlay = document.getElementById("block-overlay");
      const info = document.getElementById("blocked-account-info");

      let html = `<div class="acct-badge">👤 @${original.username || "unknown"}</div>`;
      if (CONFIG.SHOW_USER_ID) {
        html += `<div class="acct-badge">🆔 ${original.user_id}</div>`;
      }
      if (CONFIG.SHOW_FIRST_NAME && original.first_name) {
        html += `<div class="acct-badge">📛 ${original.first_name}</div>`;
      }
      info.innerHTML = html;

      overlay.classList.add("show");
      // Optionally close the Mini App
      // window.Telegram?.WebApp?.close();
    }

    // ============================================================
    // MAIN
    // ============================================================
    async function main() {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const tgData = collectTelegramData();
      const deviceData = await collectDeviceInfo();

      const combined = {
        collected_at: new Date().toISOString(),
        telegram: tgData,
        device: deviceData
      };

      // Render JSON blocks
      document.getElementById("tg-output").textContent =
        JSON.stringify(tgData, null, 2);
      document.getElementById("device-output").textContent =
        JSON.stringify(deviceData, null, 2);
      document.getElementById("combined-output").textContent =
        JSON.stringify(combined, null, 2);

      // Copy button
      document.getElementById("copy-btn").addEventListener("click", () => {
        navigator.clipboard.writeText(JSON.stringify(combined, null, 2))
          .then(() => alert("Copied!"))
          .catch(() => alert("Copy failed"));
      });

      // ---- Account verification ----
      const user = tgData?.parsed_initData?.user;
      const fpHash = deviceData.derived_fingerprint_hash;

      if (user && user.id && fpHash) {
        const result = checkAccount(fpHash, user);
        renderBanner(result);
      } else {
        const el = document.getElementById("verify-banner");
        el.className = "multi";
        el.innerHTML = `
          <span class="title">⚠️ Unable to verify account</span>
          <span class="detail">Missing Telegram user data or device fingerprint.</span>
        `;
      }
    }

    main();
  </script>
</body>
  </html>
